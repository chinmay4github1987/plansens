name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the generated APK'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Configure Environment (.env)
        run: |
          echo "==> Configuring environment (.env)"
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              echo "Configured .env from .env.example"
            else
              touch .env
            fi
          fi

          # If user optionally configures GitHub Secrets, inject or override them in .env:
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            sed -i '/^GEMINI_API_KEY=/d' .env
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
            echo "Configured GEMINI_API_KEY from GitHub Secrets into .env"
          fi
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            sed -i '/^KEYSTORE_BASE64=/d' .env
            echo "KEYSTORE_BASE64=${{ secrets.KEYSTORE_BASE64 }}" >> .env
          fi
          if [ -n "${{ secrets.STORE_PASSWORD }}" ]; then
            sed -i '/^STORE_PASSWORD=/d' .env
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> .env
          fi
          if [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            sed -i '/^KEY_PASSWORD=/d' .env
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> .env
          fi

      - name: Build Release APK with Gradle
        run: |
          echo "==> Compiling assembleRelease (keystore and signing managed via .env)..."
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Locate and Package Release APK
        run: |
          mkdir -p release-output
          APK_FILE=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::Release APK not found in app/build/outputs/apk/release"
            exit 1
          fi
          echo "Found release APK at: $APK_FILE"
          cp "$APK_FILE" release-output/PlantSense-release.apk

          # Compute SHA-256 checksum for security & verification
          SHA256=$(sha256sum release-output/PlantSense-release.apk | awk '{print $1}')
          echo "Release APK SHA-256: $SHA256"
          echo "APK_SHA256=$SHA256" >> $GITHUB_ENV
          echo "APK_SIZE=$(du -h release-output/PlantSense-release.apk | cut -f1)" >> $GITHUB_ENV

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlantSense-release-apk
          path: release-output/PlantSense-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/PlantSense-release.apk
          tag_name: ${{ github.ref_name }}
          name: PlantSense ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## PlantSense Release APK

            Automated release build generated by GitHub Actions.

            - **Artifact**: `PlantSense-release.apk`
            - **Size**: `${{ env.APK_SIZE }}`
            - **SHA-256**: `${{ env.APK_SHA256 }}`
            - **Target Android Version**: Android 14/15/16 (API Level 36)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

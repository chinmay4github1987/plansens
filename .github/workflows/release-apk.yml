name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the generated APK'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Configure Environment (.env)
        run: |
          echo "==> Configuring environment secrets"
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
            echo "Configured GEMINI_API_KEY from GitHub Secrets"
          elif [ -f .env.example ]; then
            cp .env.example .env
            echo "Configured .env from .env.example fallback"
          else
            echo "GEMINI_API_KEY=" > .env
          fi

      - name: Setup Release Keystore
        id: setup-keystore
        run: |
          echo "==> Setting up Android signing keystore"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using production KEYSTORE_BASE64 from GitHub Secrets"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No custom KEYSTORE_BASE64 detected; generating CI self-signed upload keystore"
            keytool -genkeypair \
              -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=PlantSense, OU=Mobile, O=PlantSense, L=MountainView, S=CA, C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Release APK with Gradle
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          echo "==> Compiling assembleRelease..."
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Locate and Package Release APK
        run: |
          mkdir -p release-output
          APK_FILE=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::Release APK not found in app/build/outputs/apk/release"
            exit 1
          fi
          echo "Found release APK at: $APK_FILE"
          cp "$APK_FILE" release-output/PlantSense-release.apk

          # Compute SHA-256 checksum for security & verification
          SHA256=$(sha256sum release-output/PlantSense-release.apk | awk '{print $1}')
          echo "Release APK SHA-256: $SHA256"
          echo "APK_SHA256=$SHA256" >> $GITHUB_ENV
          echo "APK_SIZE=$(du -h release-output/PlantSense-release.apk | cut -f1)" >> $GITHUB_ENV

      - name: Upload Release APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlantSense-release-apk
          path: release-output/PlantSense-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/PlantSense-release.apk
          tag_name: ${{ github.ref_name }}
          name: PlantSense ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## PlantSense Release APK

            Automated release build generated by GitHub Actions.

            - **Artifact**: `PlantSense-release.apk`
            - **Size**: `${{ env.APK_SIZE }}`
            - **SHA-256**: `${{ env.APK_SHA256 }}`
            - **Target Android Version**: Android 14/15/16 (API Level 36)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
